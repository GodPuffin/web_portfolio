[package]
name = "web_portfolio"
version = "0.1.0"
edition = "2021"
description = "Marcus's portfolio, rewritten in Rust/WASM with Leptos"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
  "Window",
  "Document",
  "DocumentFragment",
  "Element",
  "HtmlElement",
  "HtmlDocument",
  "DomTokenList",
  "CssStyleDeclaration",
  "MediaQueryList",
  "MediaQueryListEvent",
  "IntersectionObserver",
  "IntersectionObserverEntry",
  "IntersectionObserverInit",
  "Storage",
  "Location",
  "EventTarget",
  "Event",
  "MouseEvent",
  "Navigator",
  "DomRect",
  "DomRectReadOnly",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
